# Engine image build (image.yml submits it as si-build). One image for every service; tag = git SHA.
#
# BuildKit with a registry cache (`:buildcache`, every layer): a build fetches only the cache layers a
# step needs and pushes only the layers that changed, instead of pulling the whole ~10 GB image first.
# The old `:cache` image's inline cache is a second source, so the switch doesn't start from scratch.
# The import check runs inside the Dockerfile, so nothing pulls the image back.
# The build context is filtered by .gcloudignore: no footage, no data beyond the committed tables, no secrets.
substitutions:
  _AR_REPO: europe-west4-docker.pkg.dev/sportlight-514020/si
  _TAG: manual
  _IMAGE: si

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker buildx create --name si --driver docker-container --use > /dev/null
        docker buildx build . \
          --file=docker/Dockerfile \
          --cache-from=type=registry,ref=${_AR_REPO}/${_IMAGE}:buildcache \
          --cache-from=type=registry,ref=${_AR_REPO}/${_IMAGE}:cache \
          --cache-to=type=registry,ref=${_AR_REPO}/${_IMAGE}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true \
          --label=org.opencontainers.image.revision=${_TAG} \
          --tag=${_AR_REPO}/${_IMAGE}:${_TAG} \
          --push


timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
