# The GPU VM's additions to compose.yaml (deploy/remote-up.sh sets COMPOSE_FILE to both).
#
# - ingest runs on the NVIDIA runtime with the L4 reserved (the clock lane doesn't need it yet; real
#   decode and perception will);
# - the engine reads its secrets (AMQP_URL) from ${SI_SECRETS}/engine.env (/opt/si/secrets), written at deploy time from
#   Secret Manager by remote-up.sh; never from the image, the release files or the repo;
# - logs rotate so a long run can't fill the disk.
x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

services:
  engine:
    env_file:
      - path: ${SI_SECRETS:-/opt/si/secrets}/engine.env
        required: false
    logging: *logging

  ingest:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}
    logging: *logging
