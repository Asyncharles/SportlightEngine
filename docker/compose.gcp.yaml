# Any engine VM's additions to compose.yaml (deploy/remote-up.sh sets COMPOSE_FILE from release.env).
#
# - the engine reads its secrets (AMQP_URL) from ${SI_SECRETS}/engine.env (/opt/si/secrets), written at
#   deploy time from Secret Manager by remote-up.sh; never from the image, the release files or the repo;
# - logs rotate so a long run can't fill the disk.
#
# A GPU VM also layers compose.gpu.yaml (the ingest on the NVIDIA runtime with the L4). The MVP's si-dev
# is a CPU VM (deploy plan: L4s were out of stock on 2026-11-08, and the clock lane needs no GPU).
x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

services:
  engine:
    env_file:
      - path: ${SI_SECRETS:-/opt/si/secrets}/engine.env
        required: false
    logging: *logging

  ingest:
    logging: *logging
