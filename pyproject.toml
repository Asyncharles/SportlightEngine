[project]
name = "sports-intensity"
version = "0.1.0"
description = "Ranks simulated live sports feeds by intensity and warns before intense moments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "av>=13",
    "httpx>=0.27",
    "psutil>=6.0",
    "jinja2>=3.1",
    "aio-pika>=9.5,<10",
]

[project.optional-dependencies]
# GPU ingest and perception. Linux-only packages are gated so the lock resolves on a laptop.
gpu = [
    "torch>=2.4",
    "pynvvideocodec>=2.2.2,<2.3; sys_platform == 'linux'",
    "faster-whisper>=1.0",
    "nvidia-ml-py>=12.560",
    "open-clip-torch>=2.26",
    "panns-inference>=0.1.1",
]
# Offline training and the forecast models the engine serves.
train = [
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "statsbombpy>=1.13",
    "fastf1>=3.4",
    "nba_api>=1.5",
]
# Static HTML reports (E3, training).
report = [
    "matplotlib>=3.9",
]
# Optional reason polish, off by default (engine.polish.enabled).
polish = [
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intensity"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs an NVIDIA GPU (runs on the VM)",
    "net: needs network access",
    "slow: long-running (minutes)",
    "e2e: engine -> RabbitMQ -> front-end backend (CI e2e job; skipped without E2E_BACKEND_URL)",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["venv", ".idea"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Query", "fastapi.Depends"]
