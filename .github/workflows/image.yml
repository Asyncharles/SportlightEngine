# Builds the engine image on Cloud Build (the CUDA image is too big for a hosted runner) as si-build,
# authenticated as si-web-ci through Workload Identity Federation. Tag = git SHA. No key anywhere.
name: image

on:
  push:
    branches: [master]
    paths: ["src/**", "docker/**", "config/**", "models/**", "data/sync/**", "scripts/**", "make/**",
            "Makefile", "pyproject.toml", "uv.lock", "infra/gcp/cloudbuild.yaml", ".gcloudignore", ".dockerignore"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_BUILD_SA: ${{ vars.GCP_BUILD_SA }}
      AR_REPO: ${{ vars.AR_REPO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Cloud Build
        run: |
          # Submitted async and polled, so it doesn't depend on permission to stream the build's logs.
          id=$(gcloud builds submit . --async --format='value(id)' \
            --config infra/gcp/cloudbuild.yaml \
            --service-account "projects/$GCP_PROJECT/serviceAccounts/$GCP_BUILD_SA" \
            --gcs-source-staging-dir "gs://${GCP_PROJECT}_cloudbuild/source" \
            --substitutions "_TAG=$GITHUB_SHA,_AR_REPO=$AR_REPO")
          echo "build $id: https://console.cloud.google.com/cloud-build/builds/$id?project=$GCP_PROJECT"
          while :; do
            status=$(gcloud builds describe "$id" --format='value(status)')
            case $status in
              SUCCESS) echo "build $id succeeded"; break ;;
              QUEUED|WORKING|PENDING) sleep 20 ;;
              *) echo "::error::Cloud Build $id ended $status"; exit 1 ;;
            esac
          done
      - name: Record digest
        run: |
          gcloud artifacts docker images describe "$AR_REPO/si:$GITHUB_SHA" \
            --format='value(image_summary.fully_qualified_digest)' > image-digest.txt
          echo "Built \`$(cat image-digest.txt)\` from \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest
          path: image-digest.txt
